name: Release

# Push a tag like v0.1.0 to build, test, attach the .vsix to a GitHub release and publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # lets the job get the OIDC token the registries trust

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tag must point at a commit on master
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
            || { echo "Tag ${GITHUB_REF_NAME} is not on master"; exit 1; }

      - name: Tag must match package.json version
        run: |
          [ "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")" ] \
            || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version"; exit 1; }

      - run: npm run lint
      - run: npm run test:unit
      - run: xvfb-run -a npm run test:integration
      - run: npm run package

      - name: GitHub release with the .vsix attached
        uses: softprops/action-gh-release@v3
        with:
          files: "*.vsix"
          generate_release_notes: true

      # Marketplace: Trusted Publishing (OIDC), no token stored. Needs a policy for this repo and
      # workflow (release.yml) on the publisher's Trusted Publishing page, then the repository
      # variable MARKETPLACE_OIDC set to "true" (Settings > Secrets and variables > Actions > Variables).
      - name: Publish to the VS Code Marketplace
        if: vars.MARKETPLACE_OIDC == 'true'
        run: npx vsce publish --oidc --packagePath *.vsix

      # Open VSX, trusted: needs a trusted publisher registered for the extension
      # (open-vsx.org > namespace > Trusted Publishers: this repo + release.yml),
      # then the repository variable OVSX_OIDC set to "true".
      - name: Publish to Open VSX (trusted)
        if: vars.OVSX_OIDC == 'true'
        run: npx ovsx publish --trusted-publishing *.vsix

      # Open VSX, token: use for the first publish, before a trusted publisher can exist.
      # Runs only while OVSX_OIDC is not "true" and the OVSX_PAT secret exists.
      - name: Publish to Open VSX (token)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: vars.OVSX_OIDC != 'true' && env.OVSX_PAT != ''
        run: npx ovsx publish *.vsix
