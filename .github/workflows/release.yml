name: Release

# Push a tag like v0.1.0 to build, test, attach the .vsix to a GitHub release and publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tag must match package.json version
        run: |
          [ "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")" ] \
            || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version"; exit 1; }

      - run: npm run lint
      - run: npm run test:unit
      - run: xvfb-run -a npm run test:integration
      - run: npm run package

      - name: GitHub release with the .vsix attached
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true

      # Publishing runs only when the secret exists, so the workflow works before you set them up.
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath *.vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        run: npx ovsx publish *.vsix
