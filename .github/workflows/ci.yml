name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - name: Cache VS Code used by the integration tests
        uses: actions/cache@v6
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Integration tests (inside VS Code, under a virtual display)
        run: xvfb-run -a npm run test:integration
      - name: Package
        run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: hashmark-vsix
          path: "*.vsix"
          if-no-files-found: error
